# LLM as Judge Proxy Configuration Example

llm_judge:
  # LLM provider: openai, anthropic, google
  provider: openai
  # Model to use for judging
  model: gpt-4o-mini
  # API key (can also be set via environment variable)
  api_key: ${LLM_JUDGE_API_KEY}
  # Temperature for generation (0.0 for deterministic)
  temperature: 0.0
  # Maximum tokens for response (keep low to save costs)
  max_tokens: 10

proxy:
  # Proxy server host
  host: 127.0.0.1
  # Proxy server port
  port: 8080

# OpenAI API key for proxied requests (can also be set via environment variable)
openai_api_key: ${OPENAI_API_KEY}
