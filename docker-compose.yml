version: '3.8'

services:
  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_JUDGE_PROVIDER=${LLM_JUDGE_PROVIDER:-openai}
      - LLM_JUDGE_MODEL=${LLM_JUDGE_MODEL:-gpt-4o-mini}
      - LLM_JUDGE_API_KEY=${LLM_JUDGE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8080
    volumes:
      - ./config:/app/config:ro
      - ~/.mitmproxy:/root/.mitmproxy
    restart: unless-stopped
